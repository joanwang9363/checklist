<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JOAN PLAYGROUND｜出國準備管家</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-[#FFFDF9] text-[#2C241E] min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 氣候矩陣：依據目的地與月份動態估計
    function getClimateEstimation(destination, dateStr) {
      const month = dateStr ? new Date(dateStr).getMonth() + 1 : 4; // 預設 4 月
      
      if (destination === 'Japan') {
        if ([12, 1, 2].includes(month)) return { tempMin: 2, tempMax: 10, rain: 20, desc: '冬季寒冷乾燥，需厚外套與保暖配件' };
        if ([3, 4, 5].includes(month)) return { tempMin: 11, tempMax: 19, rain: 30, desc: '春季舒適微涼，早晚溫差大，備洋蔥式薄外套' };
        if ([6, 7, 8].includes(month)) return { tempMin: 23, tempMax: 32, rain: 50, desc: '夏季炎熱多雨，備透氣涼爽短袖與折傘' };
        return { tempMin: 13, tempMax: 21, rain: 25, desc: '秋季涼爽宜人，適合舒適長褲與輕便罩衫' };
      }
      
      if (destination === 'Bali') {
        if (month >= 4 && month <= 10) return { tempMin: 24, tempMax: 31, rain: 15, desc: '峇里島乾季，陽光充沛微風涼爽，注意高強度防曬' };
        return { tempMin: 25, tempMax: 32, rain: 60, desc: '峇里島雨季，午後多熱帶陣雨，備防潑水鞋履與輕便雨具' };
      }

      if (destination === 'Europe') {
        if ([11, 12, 1, 2, 3].includes(month)) return { tempMin: 0, tempMax: 8, rain: 35, desc: '歐洲秋冬寒冷，務必備發熱衣、羊毛披肩與保暖大衣' };
        if ([4, 5, 9, 10].includes(month)) return { tempMin: 8, tempMax: 18, rain: 30, desc: '春秋季舒爽微涼，日夜溫差明顯，適合風衣與層次穿搭' };
        return { tempMin: 17, tempMax: 28, rain: 25, desc: '夏季乾燥日照長，備透氣棉麻服裝與墨鏡' };
      }

      if (destination === 'Korea') {
        if ([12, 1, 2].includes(month)) return { tempMin: -6, tempMax: 3, rain: 15, desc: '首爾寒冬乾燥凍冷，長版羽絨與保濕補水必備' };
        if ([3, 4, 5].includes(month)) return { tempMin: 7, tempMax: 18, rain: 25, desc: '春季微涼花季，備防風外套與針織上衣' };
        if ([6, 7, 8].includes(month)) return { tempMin: 22, tempMax: 30, rain: 55, desc: '夏季悶熱多暴雨，建議攜帶輕便防水涼鞋' };
        return { tempMin: 9, tempMax: 20, rain: 20, desc: '秋高氣爽楓葉季，早晚涼意明顯，適合西裝外套與長褲' };
      }

      return { tempMin: 18, tempMax: 26, rain: 30, desc: '海外通用氣候估計，建議隨身攜帶輕薄罩衫' };
    }

    // 核心純函式：依據行程參數計算行李清單
    function generateLuggageItems(trip) {
      const items = [];
      const climate = getClimateEstimation(trip.destination, trip.startDate);

      // 1. 各國必備入境文件（強制隨身）
      items.push({
        id: 'doc-passport',
        name: '護照正本 (有效期限 6 個月以上)',
        type: 'carry_on',
        category: '必備證件',
        quantity: 1,
        confirmed: false,
        dueTiming: '出發前 1~2 個月檢查換發',
        urgency: 'high',
        note: '登機必備，務必放隨身小包，不可托運'
      });

      items.push({
        id: 'doc-tickets',
        name: '電子機票行程單 & 住宿訂房離線憑證',
        type: 'carry_on',
        category: '必備證件',
        quantity: 1,
        confirmed: false,
        dueTiming: '出發前 24~72 小時',
        urgency: 'low',
        note: '存入手機 PDF 並建議備一份紙本'
      });

      if (trip.destination === 'Japan') {
        items.push({
          id: 'doc-vjw',
          name: 'Visit Japan Web (VJW) 入境手續 QR 截圖',
          type: 'carry_on',
          category: '必備證件',
          quantity: 1,
          confirmed: false,
          dueTiming: '出發前 24~48 小時',
          urgency: 'low',
          note: '填好海關申報與檢疫，截圖離線備查'
        });
      } else if (trip.destination === 'Bali') {
        items.push({
          id: 'doc-bali-voa',
          name: '印尼電子落地簽 (e-VoA) & 峇里島觀光稅憑證',
          type: 'carry_on',
          category: '必備證件',
          quantity: 1,
          confirmed: false,
          dueTiming: '出發前 3~7 天線上申辦',
          urgency: 'medium',
          note: '線上先繳可走快速通關，節省排隊時間'
        });
        items.push({
          id: 'doc-bali-ecd',
          name: '印尼 ECD 電子海關申報 QR 截圖',
          type: 'carry_on',
          category: '必備證件',
          quantity: 1,
          confirmed: false,
          dueTiming: '起飛前 3 天內線上填報',
          urgency: 'low',
          note: '抵達前線上填妥，出關掃描即可'
        });
      } else if (trip.destination === 'Europe') {
        items.push({
          id: 'doc-schengen',
          name: '申根醫療保險英文投保證明 (保額 3 萬歐元)',
          type: 'carry_on',
          category: '必備證件',
          quantity: 1,
          confirmed: false,
          dueTiming: '出發前 2~3 週向保險公司申請',
          urgency: 'medium',
          note: '歐洲海關抽檢必備，列印英文紙本隨身帶'
        });
      }

      // 2. 衣著件數純函式推算（依天數與洗衣設定）
      const effectiveDays = trip.laundry === 'everyday' ? 2 : trip.laundry === 'midway' ? Math.ceil(trip.days / 2) + 1 : trip.days;
      
      items.push({
        id: 'wear-top',
        name: '百搭顯瘦上衣 / 親膚針織 / 襯衫',
        type: 'checked',
        category: '衣物鞋包',
        quantity: Math.min(effectiveDays, 6),
        confirmed: false
      });
      items.push({
        id: 'wear-bottom',
        name: '垂墜高腰西裝寬褲 / 針織長裙 / 下身',
        type: 'checked',
        category: '衣物鞋包',
        quantity: Math.max(2, Math.ceil(effectiveDays / 2)),
        confirmed: false
      });
      items.push({
        id: 'wear-underwear',
        name: '無痕親膚內衣褲組',
        type: 'checked',
        category: '衣物鞋包',
        quantity: effectiveDays + 1,
        confirmed: false
      });
      items.push({
        id: 'wear-shoes',
        name: '好走漫步球鞋 / 舒適瑪莉珍鞋 (穿一備一)',
        type: 'checked',
        category: '衣物鞋包',
        quantity: 2,
        confirmed: false
      });

      // 氣候外套判斷
      if (climate.tempMin < 16) {
        items.push({
          id: 'wear-outer',
          name: '保暖外套 / 羊絨溫柔披肩',
          type: 'carry_on',
          category: '衣物鞋包',
          quantity: 1,
          confirmed: false,
          note: '早晚偏涼或機艙抗寒，建議隨身攜帶'
        });
      } else {
        items.push({
          id: 'wear-light-outer',
          name: '輕薄透氣防曬罩衫 / 冷氣房薄開衫',
          type: 'carry_on',
          category: '衣物鞋包',
          quantity: 1,
          confirmed: false,
          note: '防強烈日曬與室內強冷氣'
        });
      }

      // 3. 美妝、保養與個人護理
      items.push({
        id: 'care-mask',
        name: '高保濕深層修護面膜 (高空機艙抗乾荒)',
        type: 'carry_on',
        category: '美妝護理',
        quantity: 2,
        confirmed: false,
        note: '隨身液體需符合單件 100ml 內夾鏈袋規範'
      });
      items.push({
        id: 'care-beauty',
        name: '旅行分裝保養品 & 日常美妝包',
        type: 'checked',
        category: '美妝護理',
        quantity: 1,
        confirmed: false
      });
      items.push({
        id: 'care-sanitary',
        name: '生理用品應急備品 / 隨身護墊包',
        type: 'carry_on',
        category: '美妝護理',
        quantity: 1,
        confirmed: false
      });
      items.push({
        id: 'care-hair',
        name: '整髮離子夾 / 造型電棒 (雙電壓)',
        type: 'checked',
        category: '美妝護理',
        quantity: 1,
        confirmed: false,
        note: '插電式放托運；若為內建鋰電池充電款請隨身'
      });

      // 4. 3C 與隨身電器
      items.push({
        id: 'tech-powerbank',
        name: '行動電源 (限隨身攜帶，嚴禁托運)',
        type: 'carry_on',
        category: '3C 配件',
        quantity: 1,
        confirmed: false,
        note: '航空法規限制，必須放隨身包包'
      });
      items.push({
        id: 'tech-adapter',
        name: '萬國轉接頭 & 快速充電線組',
        type: 'carry_on',
        category: '3C 配件',
        quantity: 1,
        confirmed: false
      });

      return items;
    }

    // 安全合併演算法：保留已確認的勾選狀態
    function mergeSafely(existingItems, freshItems) {
      const merged = [];
      const freshMap = new Map(freshItems.map(item => [item.id, item]));

      // 先處理舊的項目，保留勾選狀態與數量
      for (const old of existingItems) {
        if (old.isCustom) {
          merged.push(old); // 保留使用者的自訂物品
        } else if (freshMap.has(old.id)) {
          const fresh = freshMap.get(old.id);
          merged.push({
            ...fresh,
            confirmed: old.confirmed,
            quantity: old.quantity
          });
          freshMap.delete(old.id);
        }
      }

      // 加入新條件下產生的新項目（如新的簽證文件或外套）
      for (const remaining of freshMap.values()) {
        merged.push(remaining);
      }

      return merged;
    }

    function App() {
      // 預設旅行表單狀態
      const [form, setForm] = useState({
        destination: 'Bali',
        startDate: '2027-04-05',
        days: 5,
        laundry: 'none'
      });

      // 真正用於生成清單的當前狀態
      const [activeTrip, setActiveTrip] = useState(form);
      const [items, setItems] = useState([]);
      const [activeTab, setActiveTab] = useState('all');
      const [newItemName, setNewItemName] = useState('');
      const [newItemType, setNewItemType] = useState('checked');

      // 初始化載入
      useEffect(() => {
        const saved = localStorage.getItem('joan_saved_luggage_v2');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.trip && parsed.items) {
              setForm(parsed.trip);
              setActiveTrip(parsed.trip);
              setItems(parsed.items);
              return;
            }
          } catch (e) {}
        }
        // 若無舊紀錄，依預設值生成
        const initialItems = generateLuggageItems(form);
        setItems(initialItems);
      }, []);

      // 點擊「重新計算建議」按鈕時執行更新
      const handleApplyChanges = (e) => {
        e.preventDefault();
        setActiveTrip(form);
        const fresh = generateLuggageItems(form);
        const merged = mergeSafely(items, fresh);
        setItems(merged);
        localStorage.setItem('joan_saved_luggage_v2', JSON.stringify({ trip: form, items: merged }));
      };

      // 勾選切換
      const toggleCheck = (id) => {
        setItems(prev => {
          const updated = prev.map(item => item.id === id ? { ...item, confirmed: !item.confirmed } : item);
          localStorage.setItem('joan_saved_luggage_v2', JSON.stringify({ trip: activeTrip, items: updated }));
          return updated;
        });
      };

      // 數量增減
      const updateQty = (id, delta) => {
        setItems(prev => {
          const updated = prev.map(item => {
            if (item.id === id) {
              return { ...item, quantity: Math.max(1, item.quantity + delta) };
            }
            return item;
          });
          localStorage.setItem('joan_saved_luggage_v2', JSON.stringify({ trip: activeTrip, items: updated }));
          return updated;
        });
      };

      // 自訂物品新增
      const handleAddItem = (e) => {
        e.preventDefault();
        if (!newItemName.trim()) return;
        const custom = {
          id: 'custom-' + Date.now(),
          name: newItemName.trim(),
          type: newItemType,
          category: '自訂備品',
          quantity: 1,
          confirmed: false,
          isCustom: true
        };
        const updated = [custom, ...items];
        setItems(updated);
        setNewItemName('');
        localStorage.setItem('joan_saved_luggage_v2', JSON.stringify({ trip: activeTrip, items: updated }));
      };

      // 刪除自訂物品
      const handleDeleteItem = (id) => {
        setItems(prev => {
          const updated = prev.filter(i => i.id !== id);
          localStorage.setItem('joan_saved_luggage_v2', JSON.stringify({ trip: activeTrip, items: updated }));
          return updated;
        });
      };

      const climate = useMemo(() => getClimateEstimation(activeTrip.destination, activeTrip.startDate), [activeTrip]);

      const filteredItems = useMemo(() => {
        if (activeTab === 'carry_on') return items.filter(i => i.type === 'carry_on');
        if (activeTab === 'checked') return items.filter(i => i.type === 'checked');
        return items;
      }, [items, activeTab]);

      const totalCount = items.length;
      const checkedCount = items.filter(i => i.confirmed).length;
      const progressPercent = totalCount === 0 ? 0 : Math.round((checkedCount / totalCount) * 100);

      return (
        <div className="max-w-2xl mx-auto px-4 py-8 pb-24">
          {/* Header */}
          <header className="mb-6">
            <div className="flex items-center space-x-2 text-[#C0603A] text-xs font-semibold tracking-wider uppercase mb-1">
              <span>JOAN PLAYGROUND</span>
              <span>•</span>
              <span>出國準備管家</span>
            </div>
            <h1 className="text-2xl md:text-3xl font-bold text-[#2C241E]">
              智慧整裝清單
            </h1>
            <p className="text-sm text-[#7D7063] mt-1">
              依據目的地、旅行日期與歷史氣候，自動推算妳需要的衣物數量與必備簽證時程。
            </p>
          </header>

          {/* 參數設定面板 */}
          <form onSubmit={handleApplyChanges} className="bg-white rounded-2xl p-5 border border-[#EBDCCF] shadow-sm mb-6">
            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-semibold text-[#7D7063] mb-1">目的地</label>
                <select
                  value={form.destination}
                  onChange={e => setForm({ ...form, destination: e.target.value })}
                  className="w-full bg-[#FAF6F0] border border-[#E0D2C3] rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
                >
                  <option value="Bali">印尼 (峇里島/雅加達)</option>
                  <option value="Japan">日本 (東京/關西/沖繩)</option>
                  <option value="Europe">歐洲申根區 (法/義/奧/捷)</option>
                  <option value="Korea">韓國 (首爾/釜山)</option>
                  <option value="Other">其他海外國家</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#7D7063] mb-1">出發日期</label>
                <input
                  type="date"
                  value={form.startDate}
                  onChange={e => setForm({ ...form, startDate: e.target.value })}
                  className="w-full bg-[#FAF6F0] border border-[#E0D2C3] rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#7D7063] mb-1">旅行天數</label>
                <div className="flex items-center space-x-2">
                  <input
                    type="number"
                    min="1"
                    max="60"
                    value={form.days}
                    onChange={e => setForm({ ...form, days: parseInt(e.target.value) || 1 })}
                    className="w-full bg-[#FAF6F0] border border-[#E0D2C3] rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
                  />
                  <span className="text-xs text-[#7D7063]">天</span>
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#7D7063] mb-1">洗衣安排</label>
                <select
                  value={form.laundry}
                  onChange={e => setForm({ ...form, laundry: e.target.value })}
                  className="w-full bg-[#FAF6F0] border border-[#E0D2C3] rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
                >
                  <option value="none">不洗衣服 (備妥全套)</option>
                  <option value="midway">中途洗一次 (行李減半)</option>
                  <option value="everyday">每天手洗 (極簡輕裝)</option>
                </select>
              </div>
            </div>

            {/* 執行按鈕 */}
            <div className="mt-4 pt-3 border-t border-[#F2E8DE] flex items-center justify-between">
              <span className="text-[11px] text-[#9E8E7E]">設定修改後，請點擊更新計算</span>
              <button
                type="submit"
                className="bg-[#C0603A] hover:bg-[#A8512F] text-white text-xs font-bold px-4 py-2 rounded-xl transition-all shadow-sm active:scale-95"
              >
                重新計算整裝建議
              </button>
            </div>
          </form>

          {/* 氣候常模與提醒卡片 */}
          <div className="bg-[#FAF6F0] border border-[#E8DACD] rounded-2xl p-4 mb-6 text-xs text-[#6F6052] space-y-1">
            <div className="flex items-center justify-between">
              <span className="font-bold text-[#C0603A]">
                {activeTrip.destination === 'Bali' ? '印尼 峇里島' : activeTrip.destination === 'Japan' ? '日本' : activeTrip.destination === 'Europe' ? '歐洲申根' : '海外行程'} 
                （{activeTrip.startDate} 出發，共 {activeTrip.days} 天）
              </span>
              <span className="bg-[#EFE4D7] text-[#8C7A68] px-2 py-0.5 rounded text-[10px] font-semibold">歷史常模推算</span>
            </div>
            <div>
              氣溫估計約 <strong>{climate.tempMin}°C ~ {climate.tempMax}°C</strong>，降雨機率 {climate.rain}%。
            </div>
            <div className="text-[#8A7969] text-[11px]">
              穿著指引：{climate.desc}
            </div>
          </div>

          {/* 打包進度條 */}
          <div className="bg-white rounded-2xl p-4 border border-[#EBDCCF] shadow-sm mb-6">
            <div className="flex justify-between items-center mb-2">
              <span className="text-xs font-bold text-[#2C241E]">行李打包確認進度</span>
              <span className="text-xs font-bold text-[#C0603A]">{checkedCount} / {totalCount} 件 ({progressPercent}%)</span>
            </div>
            <div className="w-full h-2.5 bg-[#FAF6F0] rounded-full overflow-hidden">
              <div
                className="h-full bg-[#C0603A] transition-all duration-300 rounded-full"
                style={{ width: `${progressPercent}%` }}
              ></div>
            </div>
          </div>

          {/* 分類切換按鈕 */}
          <div className="flex space-x-2 mb-4">
            <button
              onClick={() => setActiveTab('all')}
              className={`flex-1 py-2 text-xs font-semibold rounded-xl transition-colors ${
                activeTab === 'all'
                  ? 'bg-[#2C241E] text-white shadow-sm'
                  : 'bg-white text-[#7D7063] border border-[#EBDCCF]'
              }`}
            >
              全部 ({items.length})
            </button>
            <button
              onClick={() => setActiveTab('carry_on')}
              className={`flex-1 py-2 text-xs font-semibold rounded-xl transition-colors ${
                activeTab === 'carry_on'
                  ? 'bg-[#C0603A] text-white shadow-sm'
                  : 'bg-white text-[#7D7063] border border-[#EBDCCF]'
              }`}
            >
              隨身登機包 ({items.filter(i => i.type === 'carry_on').length})
            </button>
            <button
              onClick={() => setActiveTab('checked')}
              className={`flex-1 py-2 text-xs font-semibold rounded-xl transition-colors ${
                activeTab === 'checked'
                  ? 'bg-[#8A624A] text-white shadow-sm'
                  : 'bg-white text-[#7D7063] border border-[#EBDCCF]'
              }`}
            >
              托運行李箱 ({items.filter(i => i.type === 'checked').length})
            </button>
          </div>

          {/* 新增自訂物品欄 */}
          <form onSubmit={handleAddItem} className="flex space-x-2 mb-6">
            <input
              type="text"
              placeholder="新增自訂必備物品（如防曬乳、相機腳架）..."
              value={newItemName}
              onChange={e => setNewItemName(e.target.value)}
              className="flex-1 bg-white border border-[#EBDCCF] rounded-xl px-4 py-2.5 text-xs text-[#2C241E] focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
            />
            <select
              value={newItemType}
              onChange={e => setNewItemType(e.target.value)}
              className="bg-white border border-[#EBDCCF] rounded-xl px-2.5 py-2.5 text-xs text-[#7D7063] focus:outline-none"
            >
              <option value="checked">托運</option>
              <option value="carry_on">隨身</option>
            </select>
            <button
              type="submit"
              className="bg-[#C0603A] hover:bg-[#A8512F] text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-colors shrink-0"
            >
              新增
            </button>
          </form>

          {/* 清單項目列表 */}
          <div className="space-y-3">
            {filteredItems.map(item => (
              <div
                key={item.id}
                onClick={() => toggleCheck(item.id)}
                className={`flex items-start justify-between p-3.5 rounded-xl border transition-all cursor-pointer select-none ${
                  item.confirmed
                    ? 'bg-[#FAF6F0] border-[#E0D2C3] opacity-60'
                    : 'bg-white border-[#EBDCCF] shadow-sm'
                }`}
              >
                <div className="flex items-start space-x-3 flex-1 min-w-0 pr-2">
                  <div
                    className={`mt-0.5 w-5 h-5 rounded-md flex items-center justify-center border transition-colors shrink-0 ${
                      item.confirmed
                        ? 'bg-[#C0603A] border-[#C0603A] text-white'
                        : 'border-[#CBBBB0] bg-white'
                    }`}
                  >
                    {item.confirmed && (
                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                      </svg>
                    )}
                  </div>
                  <div className="min-w-0">
                    <div className="flex items-center space-x-2 flex-wrap">
                      <span className={`text-sm font-semibold truncate ${item.confirmed ? 'line-through text-[#9E8E7E]' : 'text-[#2C241E]'}`}>
                        {item.name}
                      </span>
                      {item.type === 'carry_on' ? (
                        <span className="text-[10px] bg-[#FFF2EC] text-[#C0603A] font-semibold px-1.5 py-0.5 rounded shrink-0">隨身</span>
                      ) : (
                        <span className="text-[10px] bg-[#F4EDE5] text-[#8A624A] font-semibold px-1.5 py-0.5 rounded shrink-0">托運</span>
                      )}
                    </div>

                    {/* 前置申辦倒數時程 */}
                    {item.dueTiming && (
                      <div className="mt-1 flex items-center space-x-1.5 text-[11px] flex-wrap">
                        <span
                          className={`font-semibold px-1.5 py-0.5 rounded text-[10px] ${
                            item.urgency === 'high'
                              ? 'bg-rose-100 text-rose-700'
                              : item.urgency === 'medium'
                              ? 'bg-amber-100 text-amber-800'
                              : 'bg-emerald-100 text-emerald-700'
                          }`}
                        >
                          {item.dueTiming}
                        </span>
                        {item.note && <span className="text-[#8E8072]">• {item.note}</span>}
                      </div>
                    )}

                    {!item.dueTiming && item.note && (
                      <div className="mt-1 text-[11px] text-[#8E8072]">
                        {item.note}
                      </div>
                    )}
                  </div>
                </div>

                {/* 數量調整與自訂刪除 */}
                <div
                  className="flex items-center space-x-1 shrink-0"
                  onClick={e => e.stopPropagation()}
                >
                  <button
                    onClick={() => updateQty(item.id, -1)}
                    className="w-6 h-6 rounded-md bg-[#FAF6F0] text-[#7D7063] hover:bg-[#EBDCCF] flex items-center justify-center text-xs font-bold"
                  >
                    -
                  </button>
                  <span className="text-xs font-semibold text-[#2C241E] w-5 text-center">
                    {item.quantity}
                  </span>
                  <button
                    onClick={() => updateQty(item.id, 1)}
                    className="w-6 h-6 rounded-md bg-[#FAF6F0] text-[#7D7063] hover:bg-[#EBDCCF] flex items-center justify-center text-xs font-bold"
                  >
                    +
                  </button>
                  {item.isCustom && (
                    <button
                      onClick={() => handleDeleteItem(item.id)}
                      className="ml-1 text-[#C0603A] hover:text-rose-700 p-1 text-xs"
                      title="刪除"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
