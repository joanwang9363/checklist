<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JOAN PLAYGROUND｜出國準備管家</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (支援瀏覽器即時編譯 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-[#FFFDF9] text-[#2C241E] min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 資料型別與常模 ---
    const DESTINATIONS = [
      { id: 'Japan', name: '日本 (東京/關西/沖繩)', tempMin: 12, tempMax: 20, rain: 25 },
      { id: 'Bali', name: '印尼 (峇里島/雅加達)', tempMin: 24, tempMax: 31, rain: 40 },
      { id: 'Europe', name: '歐洲申根區 (法/義/奧/捷)', tempMin: 8, tempMax: 16, rain: 35 },
      { id: 'USA', name: '美國 / 加拿大', tempMin: 10, tempMax: 18, rain: 20 },
      { id: 'Korea', name: '韓國 (首爾/釜山)', tempMin: 9, tempMax: 19, rain: 20 },
      { id: 'Other', name: '其他海外國家', tempMin: 15, tempMax: 24, rain: 30 }
    ];

    function calculateLuggageItems(trip) {
      const items = [];
      const dest = DESTINATIONS.find(d => d.id === trip.destination) || DESTINATIONS[0];
      const pax = trip.travelers || 1;

      // 1. 必備文件 (強制隨身)
      items.push({
        id: 'doc-passport',
        name: `護照正本 (效期 6 個月以上) × ${pax} 份`,
        type: 'carry_on',
        category: '必備文件',
        quantity: pax,
        confirmed: false,
        dueTiming: '出發前 1~2 個月',
        urgency: 'high',
        note: '登機必備，不可托運'
      });

      items.push({
        id: 'doc-tickets',
        name: '電子機票行程單 & 飯店離線憑證',
        type: 'carry_on',
        category: '必備文件',
        quantity: 1,
        confirmed: false,
        dueTiming: '出發前 24~72 小時',
        urgency: 'low',
        note: '建議下載手機離線 PDF 並列印一份'
      });

      if (trip.destination === 'Japan') {
        items.push({
          id: 'doc-vjw',
          name: 'Visit Japan Web (VJW) 入境申報 QR 截圖',
          type: 'carry_on',
          category: '必備文件',
          quantity: 1,
          confirmed: false,
          dueTiming: '出發前 24~48 小時',
          urgency: 'low',
          note: '填寫海關與檢疫資訊並截圖保存'
        });
      } else if (trip.destination === 'Bali') {
        items.push({
          id: 'doc-bali-voa',
          name: '印尼電子落地簽 (e-VoA) & 觀光稅繳納憑證',
          type: 'carry_on',
          category: '必備文件',
          quantity: 1,
          confirmed: false,
          dueTiming: '出發前 3~7 天',
          urgency: 'medium',
          note: '線上先辦可節省入境排隊時間'
        });
        items.push({
          id: 'doc-bali-ecd',
          name: '印尼 ECD 電子海關申報 QR 截圖',
          type: 'carry_on',
          category: '必備文件',
          quantity: 1,
          confirmed: false,
          dueTiming: '起飛前 3 天內',
          urgency: 'low',
          note: '每戶填寫一份即可'
        });
      } else if (trip.destination === 'Europe') {
        items.push({
          id: 'doc-schengen-ins',
          name: '申根醫療保險英文投保證明 (保額 3 萬歐元)',
          type: 'carry_on',
          category: '必備文件',
          quantity: pax,
          confirmed: false,
          dueTiming: '出發前 2~3 週',
          urgency: 'medium',
          note: '海關抽查必備，請備妥英文紙本'
        });
      } else if (trip.destination === 'USA') {
        items.push({
          id: 'doc-esta',
          name: '美加 ESTA / eTA 電子授權核准憑證',
          type: 'carry_on',
          category: '必備文件',
          quantity: pax,
          confirmed: false,
          dueTiming: '出發前至少 72 小時',
          urgency: 'high',
          note: '審核需工作天，務必提早完成'
        });
      }

      // 2. 衣著件數依天數與洗衣計算
      const effectiveDays = trip.laundry === 'everyday' ? 2 : trip.laundry === 'midway' ? Math.ceil(trip.days / 2) + 1 : trip.days;
      
      items.push({
        id: 'wear-top',
        name: '舒適日常百搭上衣',
        type: 'checked',
        category: '服飾鞋包',
        quantity: Math.min(effectiveDays, 6),
        confirmed: false
      });
      items.push({
        id: 'wear-bottom',
        name: '高腰西裝寬褲 / 針織長裙 / 下身',
        type: 'checked',
        category: '服飾鞋包',
        quantity: Math.max(2, Math.ceil(effectiveDays / 2)),
        confirmed: false
      });
      items.push({
        id: 'wear-underwear',
        name: '親膚內著與貼身衣物組',
        type: 'checked',
        category: '服飾鞋包',
        quantity: effectiveDays + 1,
        confirmed: false
      });
      items.push({
        id: 'wear-shoes',
        name: '漫步好走球鞋 / 瑪莉珍鞋 (穿一備一)',
        type: 'checked',
        category: '服飾鞋包',
        quantity: 2,
        confirmed: false
      });

      if (dest.tempMin < 15 || trip.coldTolerance === 'cold') {
        items.push({
          id: 'wear-outer',
          name: '親膚保暖外套 / 防風洋蔥層',
          type: 'carry_on',
          category: '服飾鞋包',
          quantity: 1,
          confirmed: false,
          note: '機艙涼冷，建議隨身攜帶'
        });
      }

      // 3. 護理美妝與保養
      items.push({
        id: 'care-mask',
        name: '高保濕修護面膜 (高空機艙抗乾燥)',
        type: 'carry_on',
        category: '美妝護理',
        quantity: 2,
        confirmed: false,
        note: '單片液體需符合隨身 100ml 規範'
      });
      items.push({
        id: 'care-skincare',
        name: '旅行分裝保養乳液與美妝包',
        type: 'checked',
        category: '美妝護理',
        quantity: 1,
        confirmed: false
      });
      items.push({
        id: 'care-hygiene',
        name: '生理備品 / 隨身衛生棉包',
        type: 'carry_on',
        category: '美妝護理',
        quantity: 1,
        confirmed: false
      });
      items.push({
        id: 'care-hair',
        name: '整髮離子夾 / 整髮器 (雙電壓)',
        type: 'checked',
        category: '美妝護理',
        quantity: 1,
        confirmed: false,
        note: '插電式放托運；充電鋰電池式請隨身'
      });

      // 4. 3C 與日常隨身
      items.push({
        id: 'tech-powerbank',
        name: '行動電源 (限隨身，禁止托運)',
        type: 'carry_on',
        category: '3C 配件',
        quantity: 1,
        confirmed: false,
        note: '嚴禁放入托運行李箱'
      });
      items.push({
        id: 'tech-adapter',
        name: '萬國轉接插頭與充電線組',
        type: 'carry_on',
        category: '3C 配件',
        quantity: 1,
        confirmed: false
      });

      return items;
    }

    function mergeLuggageListsSafely(existing, incoming) {
      const merged = [];
      const incomingMap = new Map(incoming.map(item => [item.id, item]));

      for (const oldItem of existing) {
        if (incomingMap.has(oldItem.id)) {
          const fresh = incomingMap.get(oldItem.id);
          merged.push({
            ...fresh,
            confirmed: oldItem.confirmed,
            quantity: oldItem.quantity
          });
          incomingMap.delete(oldItem.id);
        } else {
          merged.push(oldItem);
        }
      }

      for (const newItem of incomingMap.values()) {
        merged.push(newItem);
      }
      return merged;
    }

    // --- 主介面元件 ---
    function App() {
      const [trip, setTrip] = useState({
        destination: 'Japan',
        days: 5,
        travelers: 2,
        coldTolerance: 'cold',
        laundry: 'none'
      });

      const [items, setItems] = useState([]);
      const [activeTab, setActiveTab] = useState('all');
      const [newItemName, setNewItemName] = useState('');
      const [newItemType, setNewItemType] = useState('checked');

      // 初始化或變更時安全合併
      useEffect(() => {
        const fresh = calculateLuggageItems(trip);
        setItems(prev => {
          if (prev.length === 0) {
            const saved = localStorage.getItem('joan_luggage_state');
            if (saved) {
              try { return JSON.parse(saved); } catch (e) {}
            }
            return fresh;
          }
          return mergeLuggageListsSafely(prev, fresh);
        });
      }, [trip]);

      // 自動儲存到 LocalStorage
      useEffect(() => {
        if (items.length > 0) {
          localStorage.setItem('joan_luggage_state', JSON.stringify(items));
        }
      }, [items]);

      const toggleCheck = (id) => {
        setItems(prev => prev.map(item => item.id === id ? { ...item, confirmed: !item.confirmed } : item));
      };

      const updateQty = (id, delta) => {
        setItems(prev => prev.map(item => {
          if (item.id === id) {
            return { ...item, quantity: Math.max(1, item.quantity + delta) };
          }
          return item;
        }));
      };

      const handleAddItem = (e) => {
        e.preventDefault();
        if (!newItemName.trim()) return;
        const customItem = {
          id: 'custom-' + Date.now(),
          name: newItemName.trim(),
          type: newItemType,
          category: '自訂備品',
          quantity: 1,
          confirmed: false,
          isCustom: true
        };
        setItems(prev => [customItem, ...prev]);
        setNewItemName('');
      };

      const filteredItems = useMemo(() => {
        if (activeTab === 'carry_on') return items.filter(i => i.type === 'carry_on');
        if (activeTab === 'checked') return items.filter(i => i.type === 'checked');
        return items;
      }, [items, activeTab]);

      const totalCount = items.length;
      const checkedCount = items.filter(i => i.confirmed).length;
      const progressPercent = totalCount === 0 ? 0 : Math.round((checkedCount / totalCount) * 100);

      const destInfo = DESTINATIONS.find(d => d.id === trip.destination) || DESTINATIONS[0];

      return (
        <div className="max-w-2xl mx-auto px-4 py-8 pb-24">
          {/* Header */}
          <header className="mb-6">
            <div className="flex items-center space-x-2 text-[#C0603A] text-xs font-semibold tracking-wider uppercase mb-1">
              <span>JOAN PLAYGROUND</span>
              <span>•</span>
              <span>出國準備管家</span>
            </div>
            <h1 className="text-2xl md:text-3xl font-bold text-[#2C241E]">
              智慧整裝清單
            </h1>
            <p className="text-sm text-[#7D7063] mt-1">
              為妳自動推算氣候裝備、換洗衣物與目的國入境時程提醒。
            </p>
          </header>

          {/* 行程設定卡片 */}
          <section className="bg-white rounded-2xl p-5 border border-[#EBDCCF] shadow-sm mb-6">
            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-semibold text-[#7D7063] mb-1">目的地</label>
                <select
                  value={trip.destination}
                  onChange={e => setTrip({ ...trip, destination: e.target.value })}
                  className="w-full bg-[#FAF6F0] border border-[#E0D2C3] rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
                >
                  {DESTINATIONS.map(d => (
                    <option key={d.id} value={d.id}>{d.name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#7D7063] mb-1">旅遊天數</label>
                <div className="flex items-center space-x-2">
                  <input
                    type="number"
                    min="1"
                    max="60"
                    value={trip.days}
                    onChange={e => setTrip({ ...trip, days: parseInt(e.target.value) || 1 })}
                    className="w-full bg-[#FAF6F0] border border-[#E0D2C3] rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
                  />
                  <span className="text-xs text-[#7D7063] whitespace-nowrap">天</span>
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#7D7063] mb-1">同行人數</label>
                <div className="flex items-center space-x-2">
                  <input
                    type="number"
                    min="1"
                    max="10"
                    value={trip.travelers}
                    onChange={e => setTrip({ ...trip, travelers: parseInt(e.target.value) || 1 })}
                    className="w-full bg-[#FAF6F0] border border-[#E0D2C3] rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
                  />
                  <span className="text-xs text-[#7D7063] whitespace-nowrap">人</span>
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#7D7063] mb-1">洗衣安排</label>
                <select
                  value={trip.laundry}
                  onChange={e => setTrip({ ...trip, laundry: e.target.value })}
                  className="w-full bg-[#FAF6F0] border border-[#E0D2C3] rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
                >
                  <option value="none">不洗衣服 (備妥全套)</option>
                  <option value="midway">中途洗一次 (省行李空間)</option>
                  <option value="everyday">天天洗 (極簡輕裝)</option>
                </select>
              </div>
            </div>

            {/* 當地常模提示 */}
            <div className="mt-4 pt-3 border-t border-[#F2E8DE] flex items-center justify-between text-xs text-[#7D7063]">
              <div>
                歷史氣候估計：約 <strong className="text-[#C0603A]">{destInfo.tempMin}°C ~ {destInfo.tempMax}°C</strong>，降雨機率 {destInfo.rain}%
              </div>
              <span className="text-[10px] bg-[#FAF6F0] text-[#9E8E7E] px-2 py-0.5 rounded-full">季節常模</span>
            </div>
          </section>

          {/* 打包進度條 */}
          <div className="bg-white rounded-2xl p-4 border border-[#EBDCCF] shadow-sm mb-6">
            <div className="flex justify-between items-center mb-2">
              <span className="text-xs font-bold text-[#2C241E]">行李確認進度</span>
              <span className="text-xs font-bold text-[#C0603A]">{checkedCount} / {totalCount} 件 ({progressPercent}%)</span>
            </div>
            <div className="w-full h-2.5 bg-[#FAF6F0] rounded-full overflow-hidden">
              <div
                className="h-full bg-[#C0603A] transition-all duration-300 rounded-full"
                style={{ width: `${progressPercent}%` }}
              ></div>
            </div>
          </div>

          {/* 分類切換按鈕 */}
          <div className="flex space-x-2 mb-4">
            <button
              onClick={() => setActiveTab('all')}
              className={`flex-1 py-2 text-xs font-semibold rounded-xl transition-colors ${
                activeTab === 'all'
                  ? 'bg-[#2C241E] text-white shadow-sm'
                  : 'bg-white text-[#7D7063] border border-[#EBDCCF]'
              }`}
            >
              全部物品 ({items.length})
            </button>
            <button
              onClick={() => setActiveTab('carry_on')}
              className={`flex-1 py-2 text-xs font-semibold rounded-xl transition-colors ${
                activeTab === 'carry_on'
                  ? 'bg-[#C0603A] text-white shadow-sm'
                  : 'bg-white text-[#7D7063] border border-[#EBDCCF]'
              }`}
            >
              隨身登機包 ({items.filter(i => i.type === 'carry_on').length})
            </button>
            <button
              onClick={() => setActiveTab('checked')}
              className={`flex-1 py-2 text-xs font-semibold rounded-xl transition-colors ${
                activeTab === 'checked'
                  ? 'bg-[#8A624A] text-white shadow-sm'
                  : 'bg-white text-[#7D7063] border border-[#EBDCCF]'
              }`}
            >
              托運行李箱 ({items.filter(i => i.type === 'checked').length})
            </button>
          </div>

          {/* 新增自訂物品欄 */}
          <form onSubmit={handleAddItem} className="flex space-x-2 mb-6">
            <input
              type="text"
              placeholder="新增自訂必備物品..."
              value={newItemName}
              onChange={e => setNewItemName(e.target.value)}
              className="flex-1 bg-white border border-[#EBDCCF] rounded-xl px-4 py-2.5 text-xs text-[#2C241E] focus:outline-none focus:ring-2 focus:ring-[#C0603A]"
            />
            <select
              value={newItemType}
              onChange={e => setNewItemType(e.target.value)}
              className="bg-white border border-[#EBDCCF] rounded-xl px-2.5 py-2.5 text-xs text-[#7D7063] focus:outline-none"
            >
              <option value="checked">托運</option>
              <option value="carry_on">隨身</option>
            </select>
            <button
              type="submit"
              className="bg-[#C0603A] hover:bg-[#A8512F] text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-colors"
            >
              新增
            </button>
          </form>

          {/* 清單項目列表 */}
          <div className="space-y-3">
            {filteredItems.map(item => (
              <div
                key={item.id}
                onClick={() => toggleCheck(item.id)}
                className={`flex items-start justify-between p-3.5 rounded-xl border transition-all cursor-pointer select-none ${
                  item.confirmed
                    ? 'bg-[#FAF6F0] border-[#E0D2C3] opacity-60'
                    : 'bg-white border-[#EBDCCF] shadow-sm'
                }`}
              >
                <div className="flex items-start space-x-3">
                  <div
                    className={`mt-0.5 w-5 h-5 rounded-md flex items-center justify-center border transition-colors ${
                      item.confirmed
                        ? 'bg-[#C0603A] border-[#C0603A] text-white'
                        : 'border-[#CBBBB0] bg-white'
                    }`}
                  >
                    {item.confirmed && (
                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                      </svg>
                    )}
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className={`text-sm font-semibold ${item.confirmed ? 'line-through text-[#9E8E7E]' : 'text-[#2C241E]'}`}>
                        {item.name}
                      </span>
                      {item.type === 'carry_on' ? (
                        <span className="text-[10px] bg-[#FFF2EC] text-[#C0603A] font-semibold px-1.5 py-0.5 rounded">隨身</span>
                      ) : (
                        <span className="text-[10px] bg-[#F4EDE5] text-[#8A624A] font-semibold px-1.5 py-0.5 rounded">托運</span>
                      )}
                    </div>

                    {/* 倒數時程提醒 */}
                    {item.dueTiming && (
                      <div className="mt-1 flex items-center space-x-1.5 text-[11px]">
                        <span
                          className={`font-semibold px-1.5 py-0.5 rounded text-[10px] ${
                            item.urgency === 'high'
                              ? 'bg-rose-100 text-rose-700'
                              : item.urgency === 'medium'
                              ? 'bg-amber-100 text-amber-800'
                              : 'bg-emerald-100 text-emerald-700'
                          }`}
                        >
                          {item.dueTiming}
                        </span>
                        {item.note && <span className="text-[#8E8072]">• {item.note}</span>}
                      </div>
                    )}

                    {!item.dueTiming && item.note && (
                      <div className="mt-1 text-[11px] text-[#8E8072]">
                        {item.note}
                      </div>
                    )}
                  </div>
                </div>

                {/* 數量微調按鈕 */}
                <div
                  className="flex items-center space-x-1 ml-2"
                  onClick={e => e.stopPropagation()}
                >
                  <button
                    onClick={() => updateQty(item.id, -1)}
                    className="w-6 h-6 rounded-md bg-[#FAF6F0] text-[#7D7063] hover:bg-[#EBDCCF] flex items-center justify-center text-xs font-bold"
                  >
                    -
                  </button>
                  <span className="text-xs font-semibold text-[#2C241E] w-5 text-center">
                    {item.quantity}
                  </span>
                  <button
                    onClick={() => updateQty(item.id, 1)}
                    className="w-6 h-6 rounded-md bg-[#FAF6F0] text-[#7D7063] hover:bg-[#EBDCCF] flex items-center justify-center text-xs font-bold"
                  >
                    +
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
